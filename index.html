<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Muat turun enjin A-Frame dan MindAR terus daripada CDN -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- Sediakan Scene AR -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Daftarkan imej 2D anda di sini -->
        <img id="myOverlay" src="./grafik2d.png" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- targetIndex: 0 merujuk kepada imej pertama di dalam fail targets.mind -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Paparkan satah 2D di atas penanda -->
        <!-- Laraskan width, height, dan position mengikut kesesuaian -->
        <a-plane 
          src="#myOverlay" 
          position="0 0 0" 
          height="1" 
          width="1" 
          rotation="0 0 0"
          transparent="true">
        </a-plane>
      </a-entity>
      
    </a-scene>
  </body>
</html>
